name: CI

# Runs on every pull request and on every push to main: type check, lint, unit
# tests and a production build. No secrets are needed: the build works without
# any environment variable (every integration fails safe when its key is
# missing), so the job also runs on pull requests from forks.
on:
  pull_request:
  push:
    branches: [main]

# Read-only token: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
